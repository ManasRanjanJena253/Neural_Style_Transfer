<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neural Style Transfer: Where Deep Learning Meets Art</title>
  <meta name="description" content="Neural Style Transfer using PyTorch – blending everyday images with iconic art styles. Curated gallery of AI-generated outputs."/>
  <!-- Google Fonts: Poppins and Space Grotesk -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Rive CDN for interactive animations -->
  <script src="https://unpkg.com/@rive-app/canvas@2.11.3/rive.min.js"></script>
  <!-- React & ReactDOM (for browser, via CDN) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX support -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      /* Masculine, elegant color palette */
      --main-bg: linear-gradient(135deg, #f6f8fa 0%, #c7d0e5 60%, #495d7f 100%);
      --accent-blue: #3a5fa9;
      --accent-navy: #1e2a3a;
      --accent-steel: #495d7f;
      --accent-silver: #b0beca;
      --accent-cobalt: #3571b7;
      --text-main: #232c3d;
      --text-light: #495d7f;
      --text-white: #fff;
      --card-bg: rgba(255,255,255,0.92);
      --card-glass: blur(10px) saturate(1.12);
      --card-shadow: 0 4px 32px #495d7f2a, 0 2px 16px #3a5fa91a;
      --accent-gradient: linear-gradient(90deg, #3571b7 0%, #495d7f 100%);
      --hover-gradient: linear-gradient(90deg, #dde4ee 0%, #b0beca 100%);
      /* Button shadows */
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100vw;
      box-sizing: border-box;
      font-family: 'Poppins', 'Space Grotesk', Arial, sans-serif;
      background: var(--main-bg);
      color: var(--text-main);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 10px 80px 10px;
      z-index: 2;
      position: relative;
    }
    /* Navigation */
    .nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2.8rem;
      margin-top: 6px;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--accent-steel);
      font-family: inherit;
      font-size: 1.18rem;
      font-weight: 700;
      border-radius: 8px;
      padding: 0.5rem 1.5rem;
      cursor: pointer;
      transition: background 0.15s, color 0.14s, box-shadow 0.13s;
      outline: none;
      letter-spacing: 0.02em;
    }
    .nav-btn.selected, .nav-btn:hover {
      background: var(--accent-gradient);
      color: var(--text-white);
      box-shadow: 0 2px 16px #3a5fa933;
    }

    /* Hero Section */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 0 28px 0;
      min-height: 64vh;
      z-index: 2;
      overflow: visible;
    }
    .hero-bg-anim {
      position: absolute;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      filter: blur(16px) brightness(1.08);
      overflow: hidden;
      background: radial-gradient(ellipse at 60% 40%, #3a5fa933 0%, #495d7fcc 70%, #fff0 100%);
      animation: hero-bg-move 14s ease-in-out infinite alternate;
    }
    @keyframes hero-bg-move {
      0% { background-position: 0% 0%;}
      100% { background-position: 100% 80%;}
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 740px;
      margin: 0 auto;
      padding-bottom: 20px;
    }
    .title {
      font-family: 'Space Grotesk', 'Poppins', Arial, sans-serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 18px #3571b733;
      margin-bottom: 0.7rem;
      line-height: 1.08;
    }
    .subtitle {
      font-size: 1.18rem;
      color: var(--accent-blue);
      font-weight: 600;
      margin-bottom: 1.4rem;
      letter-spacing: 0.01em;
    }
    .project-desc {
      font-size: 1.13rem;
      color: var(--text-main);
      margin: 0 auto 2.1rem auto;
      max-width: 560px;
      line-height: 1.6;
      background: rgba(255,255,255,0.97);
      border-radius: 18px;
      padding: 1.25em 1.5em;
      box-shadow: 0 2px 10px #495d7f22;
      backdrop-filter: var(--card-glass);
      border: 1.3px solid #dde4ee;
      font-family: 'Poppins', Arial, sans-serif;
      transition: background 0.25s;
    }
    .rive-anim-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2.2rem;
      min-height: 90px;
      z-index: 1;
      filter: drop-shadow(0 2px 24px #3571b7cc) brightness(1.07);
    }
    /* Gallery Section */
    .output-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 2.3rem;
      justify-content: center;
      margin: 2.2rem 0 3rem 0;
    }
    .output-card {
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 1.2rem 1rem 1.6rem 1rem;
      min-width: 240px;
      max-width: 325px;
      flex: 1 1 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.16s, transform 0.19s, background 0.21s;
      backdrop-filter: var(--card-glass);
      border: 1.2px solid #dde4ee;
    }
    .output-card:hover {
      background: var(--hover-gradient);
      box-shadow: 0 8px 36px #3a5fa999, 0 2px 12px #495d7f88;
      transform: translateY(-6px) scale(1.035);
      border: 1.8px solid var(--accent-cobalt);
    }
    .output-imgs {
      display: flex;
      gap: 0.7rem;
      margin-bottom: 1.1rem;
      align-items: center;
    }
    .out-img {
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: 10px;
      background: #dde4ee;
      border: 2.3px solid #b0beca;
      box-shadow: 0 2px 8px #495d7f33;
      transition: box-shadow 0.13s;
    }
    .output-card:hover .out-img {
      box-shadow: 0 6px 24px #3571b7cc;
    }
    .out-arrow {
      font-size: 2.1rem;
      color: var(--accent-cobalt);
      align-self: center;
      margin: 0 0.14rem;
      text-shadow: 0 2px 8px #495d7f44;
    }
    .card-caption {
      text-align: center;
      color: var(--accent-steel);
      font-size: 1.07rem;
      margin-top: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.1px;
      min-height: 2.3em;
    }
    /* Responsive Grid */
    @media (max-width: 700px) {
      .container { max-width: 100vw; padding: 4vw 0 90px 0; }
      .output-gallery { flex-direction: column; gap: 1.5rem; }
      .output-card { max-width: 98vw; min-width: 0; }
      .out-img { width: 61px; height: 61px;}
    }
    @media (max-width: 480px) {
      .title { font-size: 1.3rem; }
      .project-desc { font-size: 1.01rem; padding: 0.9em 0.7em;}
      .nav-btn { font-size: 0.97rem;}
    }
    /* Footer styles */
    .footer {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      padding: 22px 0 18px 0;
      background: rgba(255,255,255,0.94);
      color: var(--text-main);
      font-size: 1.18rem;
      text-align: center;
      letter-spacing: 0.2px;
      font-weight: 600;
      z-index: 20;
      box-shadow: 0 -2px 18px #495d7f22;
      border-top: 1.5px solid #dde4ee55;
      backdrop-filter: blur(6px) saturate(1.03);
    }
    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      background: var(--accent-gradient);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 1.13rem;
      border: none;
      border-radius: 16px;
      padding: 0.75em 1.7em;
      margin-top: 0.5em;
      cursor: pointer;
      box-shadow: 0 2px 10px #495d7f22;
      text-decoration: none;
      transition: background 0.15s, box-shadow 0.16s, transform 0.15s;
      letter-spacing: 0.01em;
    }
    .footer-btn:hover, .footer-btn:focus {
      background: linear-gradient(90deg, #495d7f 0%, #3571b7 100%);
      box-shadow: 0 4px 16px #3a5fa9cc;
      color: #fff;
      transform: scale(1.04);
      text-decoration: none;
    }
    .footer-btn svg {
      width: 1.23em;
      height: 1.23em;
      margin-bottom: -0.11em;
      fill: currentColor;
    }
  </style>
</head>
<body>
<div id="root"></div>
<div class="footer">
  <a class="footer-btn" href="https://github.com/ManasRanjanJena253/Neural_Style_Transfer" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0.297c-6.626 0-12 5.373-12 12 0 5.304 3.438 9.799 8.205 11.387 0.6 0.111 0.82-0.261 0.82-0.577 0-0.285-0.011-1.04-0.016-2.04-3.338 0.726-4.042-1.612-4.042-1.612-0.546-1.387-1.332-1.756-1.332-1.756-1.088-0.744 0.082-0.729 0.082-0.729 1.205 0.084 1.84 1.238 1.84 1.238 1.07 1.834 2.807 1.304 3.492 0.997 0.107-0.775 0.418-1.304 0.761-1.604-2.665-0.304-5.466-1.334-5.466-5.933 0-1.311 0.469-2.382 1.236-3.222-0.124-0.303-0.535-1.521 0.117-3.176 0 0 1.008-0.322 3.301 1.23 0.957-0.266 1.984-0.398 3.003-0.403 1.018 0.005 2.046 0.137 3.006 0.403 2.289-1.553 3.295-1.23 3.295-1.23 0.655 1.655 0.244 2.873 0.12 3.176 0.77 0.84 1.235 1.911 1.235 3.222 0 4.609-2.804 5.625-5.475 5.921 0.43 0.372 0.814 1.104 0.814 2.227 0 1.609-0.014 2.906-0.014 3.299 0 0.32 0.216 0.694 0.825 0.576 4.765-1.589 8.199-6.083 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
    View Source on GitHub
  </a>
</div>
<script type="text/babel">

// --- Fix: Use absolute URLs or demo placeholder images for working demo ---
// If running locally, ensure 'Neural_Style_Transfer_Model/Images/...' exist in the public directory.
// Otherwise, use placeholder images for demo:
const PLACEHOLDER_CONTENT = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=150&q=80";
const PLACEHOLDER_STYLE = "https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=150&q=80";
const PLACEHOLDER_RESULT = "https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=150&q=80";

// Use your own images if available, else fallback to placeholders
function safeImg(src, fallback) {
  // Use fetch to check if image exists? Not possible cross-origin. Just use fallback if src is empty.
  return src || fallback;
}

const OUTPUTS = [
  {
    content: "Neural_Style_Transfer_Model/Images/Cat.png",
    style: "Neural_Style_Transfer_Model/Styles/Style 1.png",
    result: "Neural_Style_Transfer_Model/Output_Image/Style_1_scenery.png",
    caption: "Style transferred from style1.jpg to content1.jpg"
  },
  {
    content: "Neural_Style_Transfer_Model/Images/Scenery.jpg",
    style: "Neural_Style_Transfer_Model/Styles/Style 3.png",
    result: "Neural_Style_Transfer_Model/Output_Image/Style_3_Cat.png",
    caption: "Style transferred from style3.jpg to content2.jpg"
  },
  {
    content: "Neural_Style_Transfer_Model/Images/Scenery.jpg",
    style: "Neural_Style_Transfer_Model/Styles/Style 2.png",
    result: "Neural_Style_Transfer_Model/Output_Image/Style_2_scenery.png",
    caption: "Style transferred from style2.jpg to content3.jpg"
  },
  {
    content: "Neural_Style_Transfer_Model/Images/Face.jpg",
    style: "Neural_Style_Transfer_Model/Styles/Style 3.png",
    result: "Neural_Style_Transfer_Model/Output_Image/Style_3_Face.png",
    caption: "Style transferred from style3.jpg to content4.jpg"
  },
  {
    content: "Neural_Style_Transfer_Model/Images/Scenery.jpg",
    style: "Neural_Style_Transfer_Model/Styles/Style 3.png",
    result: "Neural_Style_Transfer_Model/Output_Image/Style_3_Scenery.png",
    caption: "Style transferred from style3.jpg to content5.jpg"
  },
  {
    content: "Neural_Style_Transfer_Model/Images/Cat.png",
    style: "Neural_Style_Transfer_Model/Styles/Style 2.png",
    result: "Neural_Style_Transfer_Model/Output_Image/Style_2_Cat.png",
    caption: "Style transferred from style2.jpg to content6.jpg"
  }
];

function imageExists(src, onSuccess, onError) {
  const img = new window.Image();
  img.onload = onSuccess;
  img.onerror = onError;
  img.src = src;
}

//Rive animation
function RiveAnim({ src, artboard, stateMachines, style }) {
  const ref = React.useRef();
  React.useEffect(() => {
    let riveInstance;
    if (ref.current) {
      riveInstance = new rive.Rive({
        src,
        canvas: ref.current,
        artboard,
        stateMachines,
        autoplay: true
      });
      // Subtle interactivity: play/pause on hover
      if (ref.current.parentNode) {
        ref.current.parentNode.onmouseenter = () => riveInstance && riveInstance.play();
        ref.current.parentNode.onmouseleave = () => riveInstance && riveInstance.pause();
      }
    }
    return () => { riveInstance && riveInstance.cleanup && riveInstance.cleanup(); };
  }, [src, artboard, stateMachines]);
  return <canvas ref={ref} width={180} height={78} style={style}/>;
}

// --- Pages ---
function HomePage() {
  return (
    <section className="hero">
      <div className="hero-bg-anim"></div>
      <div className="rive-anim-wrap">
        <RiveAnim
          src="https://public.rive.app/community/runtime-files/2105-1572-paint-brush.riv"
          artboard="Paint"
          stateMachines="State Machine 1"
          style={{width:150, height:70}}
        />
      </div>
      <div className="hero-content">
        <h1 className="title">
          Neural Style Transfer: Where Deep Learning Meets Art
        </h1>
        <div className="subtitle">
          Explore the artistic fusion of AI and imagination
        </div>
        <div className="project-desc">
          This project uses Neural Style Transfer to blend the content of everyday images with the style of iconic artworks—transforming simple visuals into stunning digital art. While the model itself is GPU-intensive and cannot run live here, the showcased outputs are generated offline and curated to highlight the magic of deep neural networks in recreating artistic expression.
        </div>
      </div>
    </section>
  );
}

function ShowcasePage() {
  // Show images, if not found show placeholders
  // We'll use useState to cache which ones fail
  const [failures, setFailures] = React.useState({});

  function getImg(src, fallback, key) {
    if (failures[key]) return fallback;
    return src;
  }

  function handleImgError(key) {
    setFailures(f => ({ ...f, [key]: true }));
  }

  React.useEffect(() => {
    // Animate cards in
    document.querySelectorAll('.output-card').forEach((el, i) => {
      el.style.opacity = 0;
      el.style.transform = 'translateY(35px) scale(0.97)';
      setTimeout(() => {
        el.style.transition = 'opacity 0.7s cubic-bezier(.23,1.2,.32,1), transform 0.7s cubic-bezier(.23,1.2,.32,1)';
        el.style.opacity = 1;
        el.style.transform = 'translateY(0) scale(1)';
      }, 80 + i * 110);
    });
  }, []);
  return (
    <div>
      <h1 className="title" style={{fontSize:"2.1rem", marginBottom: "0.9rem"}}>Showcase Results</h1>
      <div className="subtitle" style={{marginBottom:"1.5rem"}}>See how content images are transformed by different styles!</div>
      <div className="output-gallery">
        {OUTPUTS.map((out, idx) => (
          <div className="output-card" key={idx}>
            <div className="output-imgs">
              <img
                src={getImg(out.content, PLACEHOLDER_CONTENT, `c${idx}`)}
                className="out-img"
                alt="Content"
                onError={() => handleImgError(`c${idx}`)}
              />
              <span className="out-arrow" title="plus style">&#43;</span>
              <img
                src={getImg(out.style, PLACEHOLDER_STYLE, `s${idx}`)}
                className="out-img"
                alt="Style"
                onError={() => handleImgError(`s${idx}`)}
              />
              <span className="out-arrow" title="yields result">&#8594;</span>
              <img
                src={getImg(out.result, PLACEHOLDER_RESULT, `r${idx}`)}
                className="out-img"
                alt="Result"
                onError={() => handleImgError(`r${idx}`)}
              />
            </div>
            <div className="card-caption">{out.caption}</div>
          </div>
        ))}
      </div>
      <div style={{
        textAlign:'center',
        color:'var(--accent-steel)',
        fontSize:'1.04rem',
        marginTop:'1.7rem'
      }}>
        Want to try on your own images? Clone this repo and use the model locally!
      </div>
    </div>
  );
}

function AboutPage() {
  return (
    <div>
      <h1 className="title" style={{fontSize:"2.1rem", marginBottom: "1.1rem"}}>About This Project</h1>
      <div className="project-desc" style={{maxWidth:"600px", margin:"0 auto", fontSize:"1.07rem", color: "var(--text-main)"}}>
        <b>Neural Style Transfer</b> (NST) uses deep convolutional neural networks to recompose a content image in the style of another image—often a famous painting. <br/><br/>
        <b>How it works:</b>
        <ul style={{
          color: "var(--accent-cobalt)",
          textAlign: "left",
          margin: "1rem auto",
          maxWidth: "420px",
          fontSize: "1.04rem",
          lineHeight: 1.65,
          paddingLeft: "1.15em"
        }}>
          <li>Both content and style images are processed by a pre-trained CNN (typically VGG19).</li>
          <li>Style and content losses are defined over feature maps.</li>
          <li>The output image is iteratively optimized to minimize both losses, blending content and style.</li>
        </ul>
        <span style={{color:"var(--accent-blue)", fontWeight:600}}>Explore the code or run locally via the GitHub repo!</span>
      </div>
    </div>
  );
}

// App shell with navigation
function App() {
  const [page, setPage] = React.useState('home');
  return (
    <div className="container">
      <div className="nav">
        <button className={`nav-btn ${page === 'home' ? 'selected' : ''}`}
                onClick={() => setPage('home')}>
          Home
        </button>
        <button className={`nav-btn ${page === 'showcase' ? 'selected' : ''}`}
                onClick={() => setPage('showcase')}>
          Showcase
        </button>
        <button className={`nav-btn ${page === 'about' ? 'selected' : ''}`}
                onClick={() => setPage('about')}>
          About
        </button>
      </div>
      {page === 'home' && <HomePage />}
      {page === 'showcase' && <ShowcasePage />}
      {page === 'about' && <AboutPage />}
    </div>
  );
}

// Render
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
