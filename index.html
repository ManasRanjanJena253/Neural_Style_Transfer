<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PyTorch Neural Style Transfer</title>
    <meta name="description" content="Transfer styles between images using Neural Networks!"/>
    <!-- React, ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Anime.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <!-- Basic CSS Reset & Styling -->
    <style>
        body {
          margin: 0;
          font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
          background: #151c28;
          color: #fff;
          min-height: 100vh;
          overflow-x: hidden;
        }
        .container {
          max-width: 900px;
          margin: 0 auto;
          padding: 20px 10px 80px 10px;
        }
        h1 {
          text-align: center;
          font-size: 2.6rem;
          margin-bottom: 0.5rem;
          font-weight: 800;
          letter-spacing: -1px;
          color: #f7ba2a;
          text-shadow: 2px 2px 16px #0003;
        }
        h2 {
          text-align: center;
          color: #8ac6d1;
          font-weight: 400;
          margin-bottom: 1.5rem;
        }
        .upload-section, .sample-section {
          display: flex;
          flex-wrap: wrap;
          gap: 2rem;
          justify-content: center;
          margin-bottom: 2.5rem;
        }
        .upload-box {
          background: #232f42;
          border-radius: 16px;
          padding: 1.2rem 1rem 1.7rem 1rem;
          box-shadow: 0 2px 16px #0003;
          display: flex;
          flex-direction: column;
          align-items: center;
          min-width: 210px;
          flex: 1 1 280px;
          max-width: 340px;
          position: relative;
          transition: transform 0.18s;
        }
        .upload-box.selected {
          border: 2.5px solid #f7ba2a;
          transform: scale(1.03);
          box-shadow: 0 8px 32px #f7ba2a22;
        }
        .upload-label {
          font-size: 1.02rem;
          margin-bottom: 0.6rem;
          color: #f7ba2a;
          font-weight: 600;
          letter-spacing: 0.2px;
        }
        .upload-btn {
          background: #8ac6d1;
          color: #151c28;
          border: none;
          border-radius: 8px;
          padding: 0.48rem 1.2rem;
          font-size: 1rem;
          cursor: pointer;
          font-weight: bold;
          margin-top: 0.5rem;
          margin-bottom: 0.6rem;
          transition: background 0.15s;
        }
        .upload-btn:hover {
          background: #f7ba2a;
          color: #232f42;
        }
        .img-preview {
          margin: 0.5rem 0;
          width: 100%;
          max-width: 160px;
          height: 120px;
          object-fit: contain;
          background: #111a2a;
          border-radius: 9px;
          border: 1.5px solid #232f42;
          box-shadow: 0 1px 10px #0004;
          display: block;
          margin-left: auto;
          margin-right: auto;
        }
        .sample-section {
          margin: 1.2rem 0 2.2rem 0;
          flex-wrap: wrap;
        }
        .sample-images {
          display: flex;
          gap: 0.7rem;
          flex-wrap: wrap;
          justify-content: center;
        }
        .sample-thumb {
          cursor: pointer;
          border-radius: 10px;
          border: 2px solid #222;
          box-shadow: 0 2px 10px #0003;
          transition: border 0.18s, box-shadow 0.18s;
          width: 60px;
          height: 60px;
          object-fit: cover;
          background: #232f42;
        }
        .sample-thumb.selected, .sample-thumb:hover {
          border: 2.5px solid #f7ba2a;
          box-shadow: 0 4px 18px #f7ba2a55;
          z-index: 2;
        }
        .stylize-btn {
          display: block;
          margin: 0 auto 2.2rem auto;
          background: linear-gradient(90deg, #f7ba2a 40%, #8ac6d1 100%);
          color: #232f42;
          border: none;
          border-radius: 16px;
          font-size: 1.22rem;
          font-weight: 700;
          padding: 0.82rem 2.5rem;
          cursor: pointer;
          box-shadow: 0 6px 26px #0003;
          letter-spacing: 0.2px;
          transition: box-shadow 0.2s, background 0.18s;
        }
        .stylize-btn:disabled {
          background: #444;
          color: #ccc;
          cursor: not-allowed;
          box-shadow: none;
        }
        .result-section {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin: 2.5rem 0 1.2rem 0;
        }
        .result-img {
          max-width: 340px;
          width: 100%;
          max-height: 360px;
          border-radius: 14px;
          box-shadow: 0 4px 24px #151c2877;
          border: 2px solid #8ac6d1;
          background: #232f42;
          object-fit: contain;
        }
        .loader {
          margin: 1.7rem 0 1.3rem 0;
          border: 6px solid #232f42;
          border-radius: 50%;
          border-top: 6px solid #f7ba2a;
          width: 54px;
          height: 54px;
          animation: spin 0.85s linear infinite;
        }
        @keyframes spin {
          0% { transform: rotate(0deg);}
          100% { transform: rotate(360deg);}
        }
        .footer {
          position: fixed;
          left: 0; right: 0; bottom: 0;
          width: 100%;
          padding: 12px 0 7px 0;
          background: #232f42cc;
          color: #f7ba2a;
          font-size: 1.1rem;
          text-align: center;
          letter-spacing: 0.2px;
          font-weight: 500;
          z-index: 20;
          box-shadow: 0 -2px 16px #0002;
        }
        @media (max-width: 700px) {
          .container { max-width: 100vw; padding: 4vw 0 90px 0; }
          .upload-section, .sample-section { flex-direction: column; gap: 1.5rem; }
          .upload-box { max-width: 98vw; }
          .result-img { max-width: 96vw; }
        }
        @media (max-width: 480px) {
          h1 { font-size: 2rem; }
          .upload-box { min-width: 130px; padding: 4vw 2vw 7vw 2vw;}
          .img-preview { max-width: 96vw; height: 70px; }
          .result-img { max-width: 99vw;}
        }
    </style>
</head>
<body>
<div id="root"></div>
<div class="footer">
    By : Manas Ranjan Jena.
</div>
<script type="text/babel">

    const SAMPLE_CONTENT_IMAGES = [
      { name: "Cat.png", url: "Neural_Style_Transfer_Model/Images/Cat.png" },
      { name: "Dog.png", url: "Neural_Style_Transfer_Model/Images/Dog.png" },
      { name: "Face.jpg", url: "Neural_Style_Transfer_Model/Images/Face.jpg" },
      { name: "Scenery.jpg", url: "Neural_Style_Transfer_Model/Images/Scenery.jpg" }
    ];
    const SAMPLE_STYLE_IMAGES = [
      { name: "Style 1.png", url: "Neural_Style_Transfer_Model/Styles/Style 1.png" },
      { name: "Style 2.png", url: "Neural_Style_Transfer_Model/Styles/Style 2.png" },
      { name: "Style 3.png", url: "Neural_Style_Transfer_Model/Styles/Style 3.png" }
    ];

    function animateUploadBox() {
      anime({
        targets: '.upload-box',
        scale: [0.8, 1],
        opacity: [0,1],
        duration: 850,
        delay: anime.stagger(100),
        easing: 'easeOutElastic(1, .7)'
      });
    }
    function animateResultImg() {
      anime({
        targets: '.result-img',
        scale: [0.7, 1],
        opacity: [0,1],
        duration: 800,
        easing: 'easeOutBack'
      });
    }

    function App() {
      // States
      const [contentFile, setContentFile] = React.useState(null);
      const [styleFile, setStyleFile] = React.useState(null);
      const [contentPreview, setContentPreview] = React.useState(SAMPLE_CONTENT_IMAGES[0].url);
      const [stylePreview, setStylePreview] = React.useState(SAMPLE_STYLE_IMAGES[0].url);
      const [selectedContentIdx, setSelectedContentIdx] = React.useState(0);
      const [selectedStyleIdx, setSelectedStyleIdx] = React.useState(0);
      const [resultImg, setResultImg] = React.useState(null);
      const [isLoading, setIsLoading] = React.useState(false);
      const [errorMsg, setErrorMsg] = React.useState('');

      // Animations on mount
      React.useEffect(() => {
        animateUploadBox();
      }, []);

      // Handlers
      const handleContentFile = (e) => {
        const file = e.target.files[0];
        setContentFile(file);
        setSelectedContentIdx(null);
        if (file) {
          const url = URL.createObjectURL(file);
          setContentPreview(url);
        }
      };
      const handleStyleFile = (e) => {
        const file = e.target.files[0];
        setStyleFile(file);
        setSelectedStyleIdx(null);
        if (file) {
          const url = URL.createObjectURL(file);
          setStylePreview(url);
        }
      };
      const handleSampleContent = (idx) => {
        setSelectedContentIdx(idx);
        setContentFile(null);
        setContentPreview(SAMPLE_CONTENT_IMAGES[idx].url);
      };
      const handleSampleStyle = (idx) => {
        setSelectedStyleIdx(idx);
        setStyleFile(null);
        setStylePreview(SAMPLE_STYLE_IMAGES[idx].url);
      };

      const handleStylize = async () => {
        setErrorMsg('');
        setIsLoading(true);
        setResultImg(null);

        try {
          // Prepare FormData
          const formData = new FormData();
          // For content image
          if (contentFile) {
            formData.append("content_img", contentFile);
          } else {
            // Download sample image blob
            const res = await fetch(contentPreview);
            const blob = await res.blob();
            formData.append("content_img", new File([blob], SAMPLE_CONTENT_IMAGES[selectedContentIdx ?? 0].name));
          }
          // For style image
          if (styleFile) {
            formData.append("style_img", styleFile);
          } else {
            const res = await fetch(stylePreview);
            const blob = await res.blob();
            formData.append("style_img", new File([blob], SAMPLE_STYLE_IMAGES[selectedStyleIdx ?? 0].name));
          }

          const response = await fetch("http://127.0.0.1:8000/stylize_img_upload", {
            method: "POST",
            body: formData
          });

          if (!response.ok) throw new Error("Failed to stylize image. Please try again.");
          const blob = await response.blob();
          const imgUrl = URL.createObjectURL(blob);
          setResultImg(imgUrl);
          setTimeout(() => animateResultImg(), 50);
        } catch (err) {
          setErrorMsg(err.message || "Something went wrong.");
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="container">
          <h1>PyTorch Neural Style Transfer <span role="img" aria-label="smile">😄</span></h1>
          <h2>Transfer art styles to your images in one click.</h2>

          <div className="upload-section">
            {/* Content Image */}
            <div className={`upload-box ${!contentFile && selectedContentIdx !== null ? "selected" : ""}`}>
              <div className="upload-label">Content Image</div>
              <img src={contentPreview} className="img-preview" alt="content preview"/>
              <input
                type="file"
                accept="image/png,image/jpeg"
                id="content-upload"
                style={{display: "none"}}
                onChange={handleContentFile}
              />
              <button className="upload-btn" onClick={() => document.getElementById("content-upload").click()}>
                {contentFile ? "Change Image" : "Upload Image"}
              </button>
            </div>
            {/* Style Image */}
            <div className={`upload-box ${!styleFile && selectedStyleIdx !== null ? "selected" : ""}`}>
              <div className="upload-label">Style Image</div>
              <img src={stylePreview} className="img-preview" alt="style preview"/>
              <input
                type="file"
                accept="image/png,image/jpeg"
                id="style-upload"
                style={{display: "none"}}
                onChange={handleStyleFile}
              />
              <button className="upload-btn" onClick={() => document.getElementById("style-upload").click()}>
                {styleFile ? "Change Style" : "Upload Style"}
              </button>
            </div>
          </div>
          {/* Sample images */}
          <div className="sample-section">
            <div>
              <div className="upload-label" style={{marginBottom: "0.5rem"}}>Or pick a sample content image</div>
              <div className="sample-images">
                {SAMPLE_CONTENT_IMAGES.map((img, idx) => (
                  <img
                    key={img.name}
                    src={img.url}
                    className={`sample-thumb ${selectedContentIdx === idx && !contentFile ? "selected" : ""}`}
                    alt={img.name}
                    title={img.name}
                    onClick={() => handleSampleContent(idx)}
                  />
                ))}
              </div>
            </div>
            <div>
              <div className="upload-label" style={{marginBottom: "0.5rem"}}>Or pick a sample style image</div>
              <div className="sample-images">
                {SAMPLE_STYLE_IMAGES.map((img, idx) => (
                  <img
                    key={img.name}
                    src={img.url}
                    className={`sample-thumb ${selectedStyleIdx === idx && !styleFile ? "selected" : ""}`}
                    alt={img.name}
                    title={img.name.replace(".png", "")}
                    onClick={() => handleSampleStyle(idx)}
                  />
                ))}
              </div>
            </div>
          </div>
          {/* Stylize Button */}
          <button className="stylize-btn" onClick={handleStylize} disabled={isLoading}>
            {isLoading ? "Stylizing..." : "Stylize"}
          </button>
          {/* Result Section */}
          <div className="result-section">
            {isLoading && <div className="loader"></div>}
            {errorMsg && <div style={{color: "#ff4f4f", marginBottom: "1rem"}}>{errorMsg}</div>}
            {resultImg && (
              <div>
                <div style={{margin: "0.7rem 0", fontWeight: 600, color: "#8ac6d1"}}>Your Stylized Image:</div>
                <img src={resultImg} className="result-img" alt="Result"/>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
